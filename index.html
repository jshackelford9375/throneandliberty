        // Function to convert CST time string to Date object in local time
        function timeStringToDate(timeStr) {
            const now = new Date();
            const [time, period] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            
            // Convert to 24-hour format
            if (period === 'PM' && hours !== 12) {
                hours += 12;
            } else if (period === 'AM' && hours === 12) {
                hours = 0;
            }
            
            // Create a date in CST
            const cstDate = new Date();
            // Get the date parts in CST
            const cstOptions = { 
                year: 'numeric', 
                month: 'numeric', 
                day: 'numeric',
                timeZone: 'America/Chicago' 
            };
            const cstDateParts = new Intl.DateTimeFormat('en-US', cstOptions).formatToParts(now);
            
            const cstYear = parseInt(cstDateParts.find(part => part.type === 'year').value);
            const cstMonth = parseInt(cstDateParts.find(part => part.type === 'month').value) - 1; // Months are 0-indexed in JS
            const cstDay = parseInt(cstDateParts.find(part => part.type === 'day').value);
            
            // Create a date string in ISO format with the CST date and the provided time
            const dateString = `${cstYear}-${(cstMonth + 1).toString().padStart(2, '0')}-${cstDay.toString().padStart(2, '0')}T${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:00`;
            
            // Create a date object in CST
            const cstDateTime = new Date(dateString + '-06:00'); // -06:00 is CST offset
            
            return cstDateTime;
        }

        // Function to format a date as a time string
        function formatTimeString(date) {
            let hours = date.getHours();
            const minutes = date.getMinutes();
            const period = hours >= 12 ? 'PM' : 'AM';
            
            // Convert to 12-hour format
            hours = hours % 12;
            hours = hours ? hours : 12; // Convert 0 to 12
            
            return `${hours}:${minutes.toString().padStart(2, '0')} ${period}`;
        }

        // Function to find the current, previous, and next resources
        function findResources() {
            const now = new Date();
            
            // Format for local time display - show user's local time
            const localFormatter = new Intl.DateTimeFormat('en-US', {
                hour: 'numeric',
                minute: 'numeric',
                second: 'numeric',
                hour12: true
            });
            
            // Time formatter without seconds for resource displays - fixed to CST time
            const timeFormatter = new Intl.DateTimeFormat('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true,
                timeZone: 'America/Chicago'  // Always use CST for the display times
            });
            
            document.getElementById('local-time').textContent = localFormatter.format(now);
            
            // Get the current time in CST (for calculations only)
            const cstNow = new Date(now.toLocaleString("en-US", {timeZone: "America/Chicago"}));
            
            // First, get the current hour and minute in CST
            const cstHour = cstNow.getHours();
            const cstMinute = cstNow.getMinutes();
            
            // Each spawn is at XX:00, XX:20, and XX:40 of each hour
            // Calculate which 20-minute time block we're currently in
            let currentBlockMinute;
            if (cstMinute < 20) {
                currentBlockMinute = 0;
            } else if (cstMinute < 40) {
                currentBlockMinute = 20;
            } else {
                currentBlockMinute = 40;
            }
            
            // Calculate next block
            let nextBlockHour = cstHour;
            let nextBlockMinute = currentBlockMinute + 20;
            if (nextBlockMinute >= 60) {
                nextBlockMinute = 0;
                nextBlockHour = (cstHour + 1) % 24;
            }
            
            // Calculate previous block
            let prevBlockHour = cstHour;
            let prevBlockMinute = currentBlockMinute - 20;
            if (prevBlockMinute < 0) {
                prevBlockMinute = 40;
                prevBlockHour = (cstHour - 1 + 24) % 24;
            }
            
            // Determine hour block for the patterns (each location lasts for 1 hour)
            // Convert 24-hour format to pattern index (0-3)
            const hourBlock = Math.floor(cstHour / 3) % 4;
            
            // Patterns repeat every 4 hours
            // Hour 0-2, 12-14: Seal Sanctuary chests, Shrine of Devotion mining
            // Hour 3-5, 15-17: Shrine of Devotion chests, Arkeum mining
            // Hour 6-8, 18-20: Arkeum chests, Orc Village mining
            // Hour 9-11, 21-23: Orc Village chests, Seal Sanctuary mining
            
            let currentChest, currentMining;
            if (hourBlock === 0) {
                currentChest = "Seal Sanctuary";
                currentMining = "Shrine of Devotion";
            } else if (hourBlock === 1) {
                currentChest = "Shrine of Devotion";
                currentMining = "Arkeum";
            } else if (hourBlock === 2) {
                currentChest = "Arkeum";
                currentMining = "Orc Village";
            } else { // hourBlock === 3
                currentChest = "Orc Village";
                currentMining = "Seal Sanctuary";
            }
            
            // Determine if we're changing locations in the next time block
            const nextHourBlock = Math.floor(nextBlockHour / 3) % 4;
            const isLocationChange = nextHourBlock !== hourBlock;
            
            // Determine next locations
            let nextChest = currentChest;
            let nextMining = currentMining;
            
            if (isLocationChange) {
                if (nextHourBlock === 0) {
                    nextChest = "Seal Sanctuary";
                    nextMining = "Shrine of Devotion";
                } else if (nextHourBlock === 1) {
                    nextChest = "Shrine of Devotion";
                    nextMining = "Arkeum";
                } else if (nextHourBlock === 2) {
                    nextChest = "Arkeum";
                    nextMining = "Orc Village";
                } else { // nextHourBlock === 3
                    nextChest = "Orc Village";
                    nextMining = "Seal Sanctuary";
                }
            }
            
            // Determine if the previous block was a different location
            const prevHourBlock = Math.floor(prevBlockHour / 3) % 4;
            const wasPrevLocationDifferent = prevHourBlock !== hourBlock;
            
            // Determine previous locations
            let prevChest = currentChest;
            let prevMining = currentMining;
            
            if (wasPrevLocationDifferent) {
                if (prevHourBlock === 0) {
                    prevChest = "Seal Sanctuary";
                    prevMining = "Shrine of Devotion";
                } else if (prevHourBlock === 1) {
                    prevChest = "Shrine of Devotion";
                    prevMining = "Arkeum";
                } else if (prevHourBlock === 2) {
                    prevChest = "Arkeum";
                    prevMining = "Orc Village";
                } else { // prevHourBlock === 3
                    prevChest = "Orc Village";
                    prevMining = "Seal Sanctuary";
                }
            }
            
            // Create CST time strings for display
            const formatCSTTime = (hour, minute) => {
                // Convert to 12-hour format
                let displayHour = hour % 12;
                if (displayHour === 0) displayHour = 12;
                const period = hour >= 12 ? 'PM' : 'AM';
                
                return `${displayHour}:${minute.toString().padStart(2, '0')} ${period}`;
            };
            
            // Use CST times for display
            const prevBlockTime = formatCSTTime(prevBlockHour, prevBlockMinute);
            const currentBlockTime = formatCSTTime(cstHour, currentBlockMinute);
            const nextBlockTime = formatCSTTime(nextBlockHour, nextBlockMinute);
            
            // Create resource objects for display
            const prevResource = { chest: prevChest, mining: prevMining, time: prevBlockTime };
            const currentResource = { chest: currentChest, mining: currentMining, time: currentBlockTime };
            const nextResource = { chest: nextChest, mining: nextMining, time: nextBlockTime };
            
            // Update the display
            updateResourceDisplay('chest', prevResource, currentResource, nextResource);
            updateResourceDisplay('mining', prevResource, currentResource, nextResource);
            
            // Create a Date object for the next spawn time in CST
            const nextSpawnCST = new Date();
            nextSpawnCST.setTime(cstNow.getTime()); // Start with current CST time
            nextSpawnCST.setHours(nextBlockHour, nextBlockMinute, 0, 0); // Set to next spawn time
            
            // Calculate the time difference
            let timeDiff = nextSpawnCST.getTime() - cstNow.getTime();
            
            // If the result is negative, it means the next spawn is tomorrow
            if (timeDiff < 0) {
                nextSpawnCST.setDate(nextSpawnCST.getDate() + 1);
                timeDiff = nextSpawnCST.getTime() - cstNow.getTime();
            }
            
            // Convert to minutes and seconds
            const minutes = Math.floor(timeDiff / (60 * 1000));
            const seconds = Math.floor((timeDiff % (60 * 1000)) / 1000);
            
            // Update countdown directly
            document.getElementById('countdown').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Update last updated time
            document.getElementById('last-updated').textContent = new Date().toLocaleString();
        }
        
        // Function to update the resource display
        function updateResourceDisplay(type, prev, current, next) {
            document.querySelector(`#previous-${type} .location-name`).textContent = prev[type];
            document.querySelector(`#previous-${type} .time-info`).textContent = prev.time;
            
            document.querySelector(`#current-${type} .location-name`).textContent = current[type];
            document.querySelector(`#current-${type} .time-info`).textContent = current.time;
            
            document.querySelector(`#next-${type} .location-name`).textContent = next[type];
            document.querySelector(`#next-${type} .time-info`).textContent = next.time;
        }
        
        // Function to update the countdown timer
        function updateCountdown(nextTime) {
            const now = new Date();
            let diff = nextTime - now;
            
            // If the next time is in the past, add 24 hours
            if (diff < 0) {
                diff = diff + (24 * 60 * 60 * 1000);
            }
            
            // Calculate minutes and seconds
            const minutes = Math.floor(diff / (60 * 1000));
            const seconds = Math.floor((diff % (60 * 1000)) / 1000);
            
            // Format the countdown display to always show two digits
            document.getElementById('countdown').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Add a label to indicate what's changing
            document.getElementById('countdown').title = `Next location change at ${nextTime.toLocaleTimeString()}`;
        }
        
        // Initial update
        findResources();
        
        // Update every second
        setInterval(findResources, 1000);
