<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Spawn Tracker</title>
    <style>
        :root {
            --bg-primary: #0d0d10;
            --bg-secondary: #151519;
            --card-bg: #1a1a21;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --timer-color: #fff1b8;
            --previous-header: #374047;
            --current-header: #14b89a;
            --next-header: #7864e0;
            --chest-color: #ff6b95;
            --mining-color: #32e3e3;
            --title-color: #9c89ff;
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        
        .container {
            max-width: 1000px;
            width: 90%;
            margin-bottom: 2rem;
        }
        
        .main-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--title-color);
            font-weight: 600;
            text-shadow: 0 0 10px rgba(156, 137, 255, 0.3);
        }
        
        .timer-container {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .timer-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
        
        .timer-display {
            font-size: 5rem;
            font-weight: 700;
            color: var(--timer-color);
            font-family: monospace;
        }
        
        .spawn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .spawn-card {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .spawn-header {
            padding: 1rem;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .previous .spawn-header {
            background-color: var(--previous-header);
        }
        
        .current .spawn-header {
            background-color: var(--current-header);
        }
        
        .next .spawn-header {
            background-color: var(--next-header);
        }
        
        .spawn-content {
            padding: 1.5rem;
            background-color: var(--card-bg);
        }
        
        .spawn-time {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        
        .spawn-location {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 500;
        }
        
        .chest-location {
            color: var(--chest-color);
        }
        
        .mining-location {
            color: var(--mining-color);
        }
        
        .location-icon {
            font-size: 1.5rem;
            margin-right: 0.75rem;
        }
        
        .upcoming-container {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .upcoming-title {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--title-color);
        }
        
        .upcoming-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .upcoming-card {
            background-color: var(--card-bg);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border-left: 3px solid var(--current-header);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .upcoming-time {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            width: 110px;
            margin-right: 1rem;
        }
        
        .upcoming-location {
            display: flex;
            align-items: center;
            margin-right: 1.5rem;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        
        footer {
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 1rem;
            text-align: center;
            width: 100%;
            margin-top: auto;
            font-size: 1.2rem;
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .spawn-grid {
                grid-template-columns: 1fr;
            }
            
            .timer-display {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>

        <div>Supple Void Supremacy</div>

    </div>

                22: { chest: "Seal Sanctuary", mining: "Shrine of Devotion" }, // 10:00 PM UTC
                23: { chest: "Shrine of Devotion", mining: "Arkeum" }   // 11:00 PM UTC
            }
        };
        
        // REFERENCE DATE - MARCH 22, 2025 is DAY 1
        const REFERENCE_DATE = new Date(Date.UTC(2025, 4, 1, 0, 0, 0, 0));
        
        // Function to get the pattern for any date and time
        function getPattern(localDate) {
            // Convert local date to UTC for pattern lookup
            const utcDate = new Date(Date.UTC(
                localDate.getUTCFullYear(),
                localDate.getUTCMonth(),
                localDate.getUTCDate(),
                localDate.getUTCHours(),
                0, 0, 0
            ));
            
            // Get UTC calendar date at midnight
            const utcMidnight = new Date(Date.UTC(
                utcDate.getUTCFullYear(),
                utcDate.getUTCMonth(),
                utcDate.getUTCDate(),
                0, 0, 0, 0
            ));
            
            // Calculate days since reference date
            const diffTime = utcMidnight - REFERENCE_DATE;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            // Calculate day in 4-day cycle (1-4)
            const dayInCycle = ((diffDays % 4) + 4) % 4 + 1;
            
            // Get UTC hour (0-23)
            const utcHour = utcDate.getUTCHours();
            
            // Return pattern for this day and hour
            return PATTERN[dayInCycle][utcHour];
        }
        
        // Format time for display
        function formatTime(date) {
            let hours = date.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 = 12 in 12-hour format
            
            return `${hours}:00 ${ampm}`;
        }
        
        // Update the main display
        function updateDisplay() {
            const now = new Date();
            
            // Create date objects for previous, current, and next hour
            const currentHour = new Date(now);
            currentHour.setMinutes(0, 0, 0);
            
            const previousHour = new Date(currentHour);
            previousHour.setHours(previousHour.getHours() - 1);
            
            const nextHour = new Date(currentHour);
            nextHour.setHours(nextHour.getHours() + 1);
            
            // Get patterns for these times
            const previousPattern = getPattern(previousHour);
            const currentPattern = getPattern(currentHour);
            const nextPattern = getPattern(nextHour);
            
            // Update the display
            document.getElementById('previous-time').textContent = formatTime(previousHour);
            document.getElementById('previous-chest').textContent = previousPattern.chest;
            document.getElementById('previous-mining').textContent = previousPattern.mining;
            
            document.getElementById('current-time').textContent = formatTime(currentHour);
            document.getElementById('current-chest').textContent = currentPattern.chest;
            document.getElementById('current-mining').textContent = currentPattern.mining;
            
            document.getElementById('next-time').textContent = formatTime(nextHour);
            document.getElementById('next-chest').textContent = nextPattern.chest;
            document.getElementById('next-mining').textContent = nextPattern.mining;
            
            // Update upcoming spawns and countdown
            updateUpcomingSpawns(currentHour);
            updateCountdown();
        }
        
        // Update the upcoming spawns
        function updateUpcomingSpawns(currentHour) {
            const upcomingContainer = document.getElementById('upcoming-spawns');
            upcomingContainer.innerHTML = '';
            
            // Show current plus next 10 spawns
            for (let i = 0; i <= 10; i++) {
                const localTime = new Date(currentHour);
                localTime.setHours(currentHour.getHours() + i);
                
                const pattern = getPattern(localTime);
                
                const card = document.createElement('div');
                card.className = 'upcoming-card';
                
                card.innerHTML = `
                    <div class="upcoming-time">${formatTime(localTime)}</div>
                    <div class="upcoming-location chest-location">
                        <span class="location-icon">📦</span>
                        <span>${pattern.chest}</span>
                    </div>
                    <div class="upcoming-location mining-location">
                        <span class="location-icon">💎</span>
                        <span>${pattern.mining}</span>
                    </div>
                `;
                
                upcomingContainer.appendChild(card);
            }
        }
        
        // Update the countdown timer
        function updateCountdown() {
            const now = new Date();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            // Calculate next 20-minute spawn (0, 20, or 40 minutes past the hour)
            let nextMinute;
            if (minutes < 20) {
                nextMinute = 20;
            } else if (minutes < 40) {
                nextMinute = 40;
            } else {
                nextMinute = 60; // Next hour
            }
            
            // Calculate remaining time
            let minutesRemaining, secondsRemaining;
            
            if (nextMinute === 60) {
                minutesRemaining = 59 - minutes;
                secondsRemaining = 59 - seconds;
            } else {
                minutesRemaining = nextMinute - minutes - 1;
                secondsRemaining = 59 - seconds;
                
                // Handle edge case when seconds is 0
                if (seconds === 0) {
                    minutesRemaining++;
                    secondsRemaining = 0;
                }
            }
            
            // Format the countdown display
            const countdownStr = `${minutesRemaining.toString().padStart(2, '0')}:${secondsRemaining.toString().padStart(2, '0')}`;
            document.getElementById('countdown').textContent = countdownStr;
        }
        
        // Initial update
        updateDisplay();
        
        // Update countdown every second
        setInterval(() => {
            updateCountdown();
        }, 1000);
        
        // Update display every minute
        setInterval(() => {
            const now = new Date();
            if (now.getSeconds() === 0) {
                // Update on the minute
                updateDisplay();
            }
        }, 1000);
        
        // Force update every hour
        setInterval(() => {
            updateDisplay();
        }, 60 * 60 * 1000);
    </script>
