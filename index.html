        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;

            color: #e6e6e6;
        }
        h1 {
            text-align: center;
            color: #f0f0f0;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .timer-container {
            text-align: center;
            padding: 10px;
            background-color: #16213e;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .resource-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        .resource-box {
            flex: 1;
            padding: 20px;
            background-color: #16213e;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .resource-title {
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #f0f0f0;
        }
        .location {
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            text-align: center;
        }
        .previous {
            background-color: #3a506b;
            opacity: 0.7;
        }
        .current {
            background-color: #0f3460;
            font-weight: bold;
            font-size: 1.2em;
            border: 2px solid #e94560;
        }
        .next {
            background-color: #1f4068;
        }
        .time-label {
            font-weight: bold;
            color: #e94560;
        }
        .location-name {
            font-size: 1.1em;
            margin-top: 5px;
        }
        .countdown {
            font-size: 1.8em;
            font-weight: bold;
            color: #e94560;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9em;
            color: #a0a0a0;

        // Function to convert CST time string to Date object in local time
        function timeStringToDate(timeStr) {
            const now = new Date();
            const [time, period] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            
            // Convert to 24-hour format
            if (period === 'PM' && hours !== 12) {
                hours += 12;
            } else if (period === 'AM' && hours === 12) {
                hours = 0;
            }
            
            // Create a date in CST
            const cstDate = new Date();
            // Get the date parts in CST
            const cstOptions = { 
                year: 'numeric', 
                month: 'numeric', 
                day: 'numeric',
                timeZone: 'America/Chicago' 
            };
            const cstDateParts = new Intl.DateTimeFormat('en-US', cstOptions).formatToParts(now);
            
            const cstYear = parseInt(cstDateParts.find(part => part.type === 'year').value);
            const cstMonth = parseInt(cstDateParts.find(part => part.type === 'month').value) - 1; // Months are 0-indexed in JS
            const cstDay = parseInt(cstDateParts.find(part => part.type === 'day').value);
            
            // Create a date string in ISO format with the CST date and the provided time
            const dateString = `${cstYear}-${(cstMonth + 1).toString().padStart(2, '0')}-${cstDay.toString().padStart(2, '0')}T${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:00`;
            
            // Create a date object in CST
            const cstDateTime = new Date(dateString + '-06:00'); // -06:00 is CST offset
            
            return cstDateTime;
        }

        // Function to format a date as a time string
        function formatTimeString(date) {
            let hours = date.getHours();
            const minutes = date.getMinutes();
            const period = hours >= 12 ? 'PM' : 'AM';
            
            // Convert to 12-hour format
            hours = hours % 12;
            hours = hours ? hours : 12; // Convert 0 to 12
            
            return `${hours}:${minutes.toString().padStart(2, '0')} ${period}`;
        }

        // Function to find the current, previous, and next resources
        function findResources() {
            const now = new Date();
            
            // Format for local time display
            const localFormatter = new Intl.DateTimeFormat('en-US', {
                hour: 'numeric',
                minute: 'numeric',
                second: 'numeric',
                hour12: true
            });
            
            // Format for CST time display
            const cstFormatter = new Intl.DateTimeFormat('en-US', {
                hour: 'numeric',
                minute: 'numeric',
                second: 'numeric',
                hour12: true,
                timeZone: 'America/Chicago' // CST time zone
            });
            
            document.getElementById('local-time').textContent = localFormatter.format(now);
            document.getElementById('cst-time').textContent = cstFormatter.format(now);
            
            // Get the current time in CST
            const cstNow = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Chicago"}));
            
            // First, get the current hour and minute in CST
            const cstHour = cstNow.getHours();
            const cstMinute = cstNow.getMinutes();
            
            // Find which 20-minute block we're in
            const timeBlocks = [
                {hour: 1, minute: 0}, {hour: 1, minute: 20}, {hour: 1, minute: 40},
                {hour: 2, minute: 0}, {hour: 2, minute: 20}, {hour: 2, minute: 40},
                {hour: 3, minute: 0}, {hour: 3, minute: 20}, {hour: 3, minute: 40},
                {hour: 4, minute: 0}, {hour: 4, minute: 20}, {hour: 4, minute: 40},
                {hour: 5, minute: 0}, {hour: 5, minute: 20}, {hour: 5, minute: 40},
                {hour: 6, minute: 0}, {hour: 6, minute: 20}, {hour: 6, minute: 40},
                {hour: 7, minute: 0}, {hour: 7, minute: 20}, {hour: 7, minute: 40},
                {hour: 8, minute: 0}, {hour: 8, minute: 20}, {hour: 8, minute: 40},
                {hour: 9, minute: 0}, {hour: 9, minute: 20}, {hour: 9, minute: 40},
                {hour: 10, minute: 0}, {hour: 10, minute: 20}, {hour: 10, minute: 40},
                {hour: 11, minute: 0}, {hour: 11, minute: 20}, {hour: 11, minute: 40},
                {hour: 12, minute: 0}, {hour: 12, minute: 20}, {hour: 12, minute: 40},
                // PM hours are same as AM but +12 except for 12 PM
                {hour: 13, minute: 0}, {hour: 13, minute: 20}, {hour: 13, minute: 40},
                {hour: 14, minute: 0}, {hour: 14, minute: 20}, {hour: 14, minute: 40},
                {hour: 15, minute: 0}, {hour: 15, minute: 20}, {hour: 15, minute: 40},
                {hour: 16, minute: 0}, {hour: 16, minute: 20}, {hour: 16, minute: 40},
                {hour: 17, minute: 0}, {hour: 17, minute: 20}, {hour: 17, minute: 40},
                {hour: 18, minute: 0}, {hour: 18, minute: 20}, {hour: 18, minute: 40},
                {hour: 19, minute: 0}, {hour: 19, minute: 20}, {hour: 19, minute: 40},
                {hour: 20, minute: 0}, {hour: 20, minute: 20}, {hour: 20, minute: 40},
                {hour: 21, minute: 0}, {hour: 21, minute: 20}, {hour: 21, minute: 40},
                {hour: 22, minute: 0}, {hour: 22, minute: 20}, {hour: 22, minute: 40},
                {hour: 23, minute: 0}, {hour: 23, minute: 20}, {hour: 23, minute: 40},
                {hour: 0, minute: 0}, {hour: 0, minute: 20}, {hour: 0, minute: 40}
            ];
            
            // Function to check if current time is after a time block
            function isTimeAfter(hour, minute, blockHour, blockMinute) {
                return (hour > blockHour) || (hour === blockHour && minute >= blockMinute);
            }
            
            // Find current time block
            let currentTimeBlockIndex = 0;
            for (let i = 0; i < timeBlocks.length; i++) {
                const nextBlockIndex = (i + 1) % timeBlocks.length;
                const currentBlock = timeBlocks[i];
                const nextBlock = timeBlocks[nextBlockIndex];
                
                // Handle the case where we're crossing midnight
                if (nextBlock.hour < currentBlock.hour) {
                    if (isTimeAfter(cstHour, cstMinute, currentBlock.hour, currentBlock.minute) || 
                        !isTimeAfter(cstHour, cstMinute, nextBlock.hour, nextBlock.minute)) {
                        currentTimeBlockIndex = i;
                        break;
                    }
                } else {
                    if (isTimeAfter(cstHour, cstMinute, currentBlock.hour, currentBlock.minute) && 
                        !isTimeAfter(cstHour, cstMinute, nextBlock.hour, nextBlock.minute)) {
                        currentTimeBlockIndex = i;
                        break;
                    }
                }
            }
            
            // Determine resource locations based on the cycle pattern
            // The pattern is Seal Sanctuary → Shrine of Devotion → Arkeum → Orc Village → repeat
            // Each location lasts for 1 hour (3 x 20 minute blocks)
            const hourBlock = Math.floor(currentTimeBlockIndex / 3) % 4;
            
            let currentChest, currentMining;
            if (hourBlock === 0) {
                currentChest = "Seal Sanctuary";
                currentMining = "Shrine of Devotion";
            } else if (hourBlock === 1) {
                currentChest = "Shrine of Devotion";
                currentMining = "Arkeum";
            } else if (hourBlock === 2) {
                currentChest = "Arkeum";
                currentMining = "Orc Village";
            } else { // hourBlock === 3
                currentChest = "Orc Village";
                currentMining = "Seal Sanctuary";
            }
            
            // Calculate next time block index
            const nextTimeBlockIndex = (currentTimeBlockIndex + 1) % timeBlocks.length;
            
            // Determine if we're changing locations in the next time block
            const nextHourBlock = Math.floor(nextTimeBlockIndex / 3) % 4;
            const isLocationChange = nextHourBlock !== hourBlock;
            
            // Determine next spawn locations (same location for 20-min blocks within the hour)
            let nextChest = currentChest;
            let nextMining = currentMining;
            
            // If we're changing hour blocks, update the next locations
            if (isLocationChange) {
                if (nextHourBlock === 0) {
                    nextChest = "Seal Sanctuary";
                    nextMining = "Shrine of Devotion";
                } else if (nextHourBlock === 1) {
                    nextChest = "Shrine of Devotion";
                    nextMining = "Arkeum";
                } else if (nextHourBlock === 2) {
                    nextChest = "Arkeum";
                    nextMining = "Orc Village";
                } else { // nextHourBlock === 3
                    nextChest = "Orc Village";
                    nextMining = "Seal Sanctuary";
                }
            }
            
            // Calculate previous time block index
            const prevTimeBlockIndex = (currentTimeBlockIndex - 1 + timeBlocks.length) % timeBlocks.length;
            
            // Determine if we came from a different location in the previous time block
            const prevHourBlock = Math.floor(prevTimeBlockIndex / 3) % 4;
            const wasPrevLocationDifferent = prevHourBlock !== hourBlock;
            
            // Determine previous spawn locations (default to same location)
            let prevChest = currentChest;
            let prevMining = currentMining;
            
            // If we changed locations in the previous block, determine the previous locations
            if (wasPrevLocationDifferent) {
                if (prevHourBlock === 0) {
                    prevChest = "Seal Sanctuary";
                    prevMining = "Shrine of Devotion";
                } else if (prevHourBlock === 1) {
                    prevChest = "Shrine of Devotion";
                    prevMining = "Arkeum";
                } else if (prevHourBlock === 2) {
                    prevChest = "Arkeum";
                    prevMining = "Orc Village";
                } else { // prevHourBlock === 3
                    prevChest = "Orc Village";
                    prevMining = "Seal Sanctuary";
                }
            }
            
            // Format time block to display
            const formatTimeBlock = (block) => {
                let hour = block.hour;
                const minute = block.minute;
                const period = hour >= 12 ? 'PM' : 'AM';
                
                // Convert to 12-hour format
                if (hour > 12) hour -= 12;
                else if (hour === 0) hour = 12;
                
                return `${hour}:${minute.toString().padStart(2, '0')} ${period}`;
            };
            
            const prevBlockTime = formatTimeBlock(timeBlocks[prevTimeBlockIndex]);
            const currentBlockTime = formatTimeBlock(timeBlocks[currentTimeBlockIndex]);
            const nextBlockTime = formatTimeBlock(timeBlocks[nextTimeBlockIndex]);
            
            // Create mock resource objects for display
            const prevResource = { chest: prevChest, mining: prevMining, time: prevBlockTime };
            const currentResource = { chest: currentChest, mining: currentMining, time: currentBlockTime };
            const nextResource = { chest: nextChest, mining: nextMining, time: nextBlockTime };
            
            // Update the display
            updateResourceDisplay('chest', prevResource, currentResource, nextResource);
            updateResourceDisplay('mining', prevResource, currentResource, nextResource);
            
            // Calculate time for the next spawn
            // Next spawn is always at the next 20-minute block
            const nextBlockHour = timeBlocks[nextTimeBlockIndex].hour;
            const nextBlockMinute = timeBlocks[nextTimeBlockIndex].minute;
            
            // Create a date for the next spawn
            const nextSpawnDate = new Date(cstNow);
            
            // If we're already past the time for the next block in the current day,
            // we need to add a day to get the correct next spawn time
            if (cstHour > nextBlockHour || (cstHour === nextBlockHour && cstMinute >= nextBlockMinute)) {
                nextSpawnDate.setDate(nextSpawnDate.getDate() + 1);
            }
            
            // Set the hours and minutes for the next spawn
            nextSpawnDate.setHours(nextBlockHour, nextBlockMinute, 0, 0);
            
            // Convert from CST to local time
            const nextSpawnLocalDate = new Date(nextSpawnDate.toLocaleString("en-US", {timeZone: "America/Chicago"}));
            
            // Update countdown to next spawn
            updateCountdown(nextSpawnLocalDate);
            
            // Update last updated time
            document.getElementById('last-updated').textContent = new Date().toLocaleString();
        }
        
        // Function to update the resource display
        function updateResourceDisplay(type, prev, current, next) {
            document.querySelector(`#previous-${type} .location-name`).textContent = prev[type];
            document.querySelector(`#previous-${type} .time-info`).textContent = prev.time;
            
            document.querySelector(`#current-${type} .location-name`).textContent = current[type];
            document.querySelector(`#current-${type} .time-info`).textContent = current.time;
            
            document.querySelector(`#next-${type} .location-name`).textContent = next[type];
            document.querySelector(`#next-${type} .time-info`).textContent = next.time;
        }
        
        // Function to update the countdown timer
        function updateCountdown(nextTime) {
            const now = new Date();
            let diff = nextTime - now;
            
            // If the next time is in the past, add 24 hours
            if (diff < 0) {
                diff = diff + (24 * 60 * 60 * 1000);
            }
            
            // Calculate minutes and seconds
            const minutes = Math.floor(diff / (60 * 1000));
            const seconds = Math.floor((diff % (60 * 1000)) / 1000);
            
            // Format the countdown display to always show two digits
            document.getElementById('countdown').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Add a label to indicate what's changing
            document.getElementById('countdown').title = `Next location change at ${nextTime.toLocaleTimeString()}`;
        }

        findResources();
        
        // Update every second
        setInterval(findResources, 1000);
