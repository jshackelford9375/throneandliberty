<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Spawn Tracker</title>
    <style>
        :root {
            --bg-primary: #0d0d10;
            --bg-secondary: #151519;
            --card-bg: #1a1a21;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --timer-color: #fff1b8;
            --previous-header: #374047;
            --current-header: #14b89a;
            --next-header: #7864e0;
            --chest-color: #ff6b95;
            --mining-color: #32e3e3;
            --title-color: #9c89ff;
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        
        .container {
            max-width: 1000px;
            width: 90%;
            margin-bottom: 2rem;
        }
        
        .main-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--title-color);
            font-weight: 600;
            text-shadow: 0 0 10px rgba(156, 137, 255, 0.3);
        }
        
        .timer-container {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .timer-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
        
        .timer-display {
            font-size: 5rem;
            font-weight: 700;
            color: var(--timer-color);
            font-family: monospace;
        }
        
        .spawn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .spawn-card {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .spawn-header {
            padding: 1rem;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .previous .spawn-header {
            background-color: var(--previous-header);
        }
        
        .current .spawn-header {
            background-color: var(--current-header);
        }
        
        .next .spawn-header {
            background-color: var(--next-header);
        }
        
        .spawn-content {
            padding: 1.5rem;
            background-color: var(--card-bg);
        }
        
        .spawn-time {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        
        .spawn-location {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 500;
        }
        
        .chest-location {
            color: var(--chest-color);
        }
        
        .mining-location {
            color: var(--mining-color);
        }
        
        .location-icon {
            font-size: 1.5rem;
            margin-right: 0.75rem;
        }
        
        .upcoming-container {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .upcoming-title {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--title-color);
        }
        
        .upcoming-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .upcoming-card {
            background-color: var(--card-bg);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border-left: 3px solid var(--current-header);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .upcoming-time {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            width: 110px;
            margin-right: 1rem;
        }
        
        .upcoming-location {
            display: flex;
            align-items: center;
            margin-right: 1.5rem;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        
        footer {
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 1rem;
            text-align: center;
            width: 100%;
            margin-top: auto;
            font-size: 1.2rem;
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .spawn-grid {
                grid-template-columns: 1fr;
            }
            
            .timer-display {
                font-size: 3.5rem;
            }
            
            .upcoming-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="main-title">
        <div>Supple Void Supremacy</div>
        <div style="font-size: 1rem; margin-top: 0.5rem; color: var(--text-secondary);">Times displayed in your local time zone</div>
    </header>
    
    <div class="container">
        <div class="timer-container">
            <div class="timer-title">Next 20-Min Spawn In:</div>
            <div class="timer-display" id="countdown">05:04</div>
        </div>
        
        <div class="spawn-grid">
            <div class="spawn-card previous">
                <div class="spawn-header">Previous Spawn</div>
                <div class="spawn-content">
                    <div class="spawn-time" id="previous-time">12:00 PM</div>
                    <div class="spawn-location chest-location">
                        <span class="location-icon">📦</span>
                        <span id="previous-chest">Seal Sanctuary</span>
                    </div>
                    <div class="spawn-location mining-location">
                        <span class="location-icon">💎</span>
                        <span id="previous-mining">Shrine of Devotion</span>
                    </div>
                </div>
            </div>
            
            <div class="spawn-card current">
                <div class="spawn-header">Current Spawn</div>
                <div class="spawn-content">
                    <div class="spawn-time" id="current-time">1:00 PM</div>
                    <div class="spawn-location chest-location">
                        <span class="location-icon">📦</span>
                        <span id="current-chest">Shrine of Devotion</span>
                    </div>
                    <div class="spawn-location mining-location">
                        <span class="location-icon">💎</span>
                        <span id="current-mining">Arkeum</span>
                    </div>
                </div>
            </div>
            
            <div class="spawn-card next">
                <div class="spawn-header">Next Spawn</div>
                <div class="spawn-content">
                    <div class="spawn-time" id="next-time">2:00 PM</div>
                    <div class="spawn-location chest-location">
                        <span class="location-icon">📦</span>
                        <span id="next-chest">Arkeum</span>
                    </div>
                    <div class="spawn-location mining-location">
                        <span class="location-icon">💎</span>
                        <span id="next-mining">Orc Village</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="upcoming-container">
            <div class="upcoming-title">Upcoming Spawns</div>
            <div class="upcoming-grid" id="upcoming-spawns">
                <!-- Will be filled by JavaScript -->
            </div>
        </div>
    </div>
    
    <footer>
        Big ISO on top
    </footer>

    <script>
        // Define the locations
        const locations = ["Orc Village", "Seal Sanctuary", "Shrine of Devotion", "Arkeum"];
        
        // Get the reference date for the 4-day cycle (March 20, 2025)
        const startDate = new Date(2025, 2, 20);
        
        // Calculate offset between local time and CST
        // This ensures the pattern is synchronized with the game server time
        function calculateCSTOffset() {
            const now = new Date();
            const localTime = now.getTime();
            
            // Get the current time in CST
            const cstTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/Chicago' }));
            const cstTimeMs = cstTime.getTime();
            
            // Calculate the local time when CST is at XX:00, XX:20, or XX:40
            // This ensures spawns are synchronized correctly with the game
            const cstMinutes = cstTime.getMinutes();
            const cstHour = cstTime.getHours();
            
            let targetCSTTime;
            if (cstMinutes < 20) {
                // Next spawn at XX:20
                targetCSTTime = new Date(cstTime);
                targetCSTTime.setMinutes(20, 0, 0);
            } else if (cstMinutes < 40) {
                // Next spawn at XX:40
                targetCSTTime = new Date(cstTime);
                targetCSTTime.setMinutes(40, 0, 0);
            } else {
                // Next spawn at (XX+1):00
                targetCSTTime = new Date(cstTime);
                targetCSTTime.setHours(cstHour + 1);
                targetCSTTime.setMinutes(0, 0, 0);
            }
            
            return {
                offset: cstTimeMs - localTime,
                nextSpawnCST: targetCSTTime
            };
        }
        
        // Function to convert local time to equivalent CST hour for pattern calculation
        function getPatternHour(localDate) {
            // For pattern calculation, we need to know what CST hour corresponds to this local time
            const localTime = new Date(localDate.toLocaleString());
            const cstTime = new Date(localDate.toLocaleString('en-US', { timeZone: 'America/Chicago' }));
            
            // Return the CST hour for pattern calculation
            return cstTime.getHours();
        }
        
        // Function to determine the day in the 4-day cycle
        function getDayInCycle(date) {
            const localDate = new Date(date);
            const cstDate = new Date(localDate.toLocaleString('en-US', { timeZone: 'America/Chicago' }));
            
            // Calculate days since the start date (in CST)
            const cstStartDate = new Date(startDate.toLocaleString('en-US', { timeZone: 'America/Chicago' }));
            const dayDiff = Math.floor((cstDate - cstStartDate) / (24 * 60 * 60 * 1000));
            
            return (dayDiff % 4) + 1; // Returns 1, 2, 3, or 4
        }
        
        // Function to get locations based on time, considering special nighttime patterns
        function getLocations(date) {
            // Get the equivalent CST hour for pattern calculation
            const hour = getPatternHour(date);
            const dayInCycle = getDayInCycle(date);
            
            // For the night pattern (9 PM to midnight CST)
            if (hour >= 21 && hour < 24) {
                // Night patterns for each day
                const nightPatterns = {
                    1: { // Day 1
                        21: { chest: "Seal Sanctuary", mining: "Shrine of Devotion" },
                        22: { chest: "Arkeum", mining: "Orc Village" },
                        23: { chest: "Arkeum", mining: "Orc Village" }
                    },
                    2: { // Day 2
                        21: { chest: "Orc Village", mining: "Seal Sanctuary" },
                        22: { chest: "Shrine of Devotion", mining: "Arkeum" },
                        23: { chest: "Shrine of Devotion", mining: "Arkeum" }
                    },
                    3: { // Day 3
                        21: { chest: "Arkeum", mining: "Orc Village" },
                        22: { chest: "Seal Sanctuary", mining: "Shrine of Devotion" },
                        23: { chest: "Seal Sanctuary", mining: "Shrine of Devotion" }
                    },
                    4: { // Day 4
                        21: { chest: "Shrine of Devotion", mining: "Arkeum" },
                        22: { chest: "Orc Village", mining: "Seal Sanctuary" },
                        23: { chest: "Orc Village", mining: "Seal Sanctuary" }
                    }
                };
                
                return nightPatterns[dayInCycle][hour];
            }
            
            // For regular hours - calculate based on the standard pattern
            // Each location is active for 1 hour
            const hourIndex = hour % 4;
            
            // The mining node is always one step ahead
            const chestIndex = hourIndex % 4;
            const miningIndex = (hourIndex + 1) % 4;
            
            return {
                chest: locations[chestIndex],
                mining: locations[miningIndex]
            };
        }
        
        // Function to get formatted time (12-hour format with AM/PM)
        function formatTime(date) {
            let hours = date.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // The hour '0' should be '12'
            
            return `${hours}:00 ${ampm}`;
        }
        
        // Function to update the display
        function updateDisplay() {
            const now = new Date();
            
            // Set minutes and seconds to 0 to get the current hour
            const currentHour = new Date(now);
            currentHour.setMinutes(0, 0, 0);
            
            // Calculate previous and next hours
            const previousHour = new Date(currentHour);
            previousHour.setHours(previousHour.getHours() - 1);
            
            const nextHour = new Date(currentHour);
            nextHour.setHours(nextHour.getHours() + 1);
            
            // Get locations for these times
            const previousLocations = getLocations(previousHour);
            const currentLocations = getLocations(currentHour);
            const nextLocations = getLocations(nextHour);
            
            // Update the display
            document.getElementById('previous-time').textContent = formatTime(previousHour);
            document.getElementById('previous-chest').textContent = previousLocations.chest;
            document.getElementById('previous-mining').textContent = previousLocations.mining;
            
            document.getElementById('current-time').textContent = formatTime(currentHour);
            document.getElementById('current-chest').textContent = currentLocations.chest;
            document.getElementById('current-mining').textContent = currentLocations.mining;
            
            document.getElementById('next-time').textContent = formatTime(nextHour);
            document.getElementById('next-chest').textContent = nextLocations.chest;
            document.getElementById('next-mining').textContent = nextLocations.mining;
            
            // Update upcoming spawns
            updateUpcomingSpawns(currentHour);
            
            // Update countdown
            updateCountdown();
        }
        
        // Function to update the upcoming spawns section
        function updateUpcomingSpawns(currentHour) {
            const upcomingContainer = document.getElementById('upcoming-spawns');
            upcomingContainer.innerHTML = ''; // Clear existing content
            
            // Show current spawn and next 10 spawns
            for (let i = 0; i <= 10; i++) {
                const spawnTime = new Date(currentHour);
                spawnTime.setHours(spawnTime.getHours() + i);
                
                const locations = getLocations(spawnTime);
                
                const card = document.createElement('div');
                card.className = 'upcoming-card';
                
                card.innerHTML = `
                    <div class="upcoming-time">${formatTime(spawnTime)}</div>
                    <div class="upcoming-location chest-location">
                        <span class="location-icon">📦</span>
                        <span>${locations.chest}</span>
                    </div>
                    <div class="upcoming-location mining-location">
                        <span class="location-icon">💎</span>
                        <span>${locations.mining}</span>
                    </div>
                `;
                
                upcomingContainer.appendChild(card);
            }
        }
        
        // Function to update the countdown timer
        function updateCountdown() {
            const now = new Date();
            
            // Calculate the next spawn time based on CST game server time
            const cstInfo = calculateCSTOffset();
            const nextSpawnCST = cstInfo.nextSpawnCST;
            
            // Convert to local time for countdown display
            const nextSpawnLocal = new Date(nextSpawnCST.getTime() - cstInfo.offset);
            
            // Calculate time difference
            const diffMs = nextSpawnLocal - now;
            
            // Calculate minutes and seconds
            const minutes = Math.floor(diffMs / (1000 * 60));
            const seconds = Math.floor((diffMs % (1000 * 60)) / 1000);
            
            // Format the countdown display (MM:SS)
            const countdownStr = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('countdown').textContent = countdownStr;
            
            // Check if we need to update the display
            if (minutes === 0 && seconds === 0) {
                setTimeout(() => {
                    updateDisplay();
                }, 1000);
            }
        }
        
        // Initial update
        updateDisplay();
        
        // Update the countdown every second
        setInterval(() => {
            updateCountdown();
        }, 1000);
        
        // Periodically update to ensure we stay in sync
        setInterval(() => {
            updateDisplay();
        }, 10 * 60 * 1000); // Every 10 minutes
    </script>
</body>
</html>
