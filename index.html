<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chest and Mining Node Spawn Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #eee;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1, h2, h3 {
            color: #ffd700;
            text-align: center;
        }
        
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .header-container h1 {
            margin: 0;
        }
        
        .secrets-btn {
            background-color: #8a5a44;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        
        .secrets-btn:hover {
            background-color: #a06b52;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .current-info {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .spawn-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        
        .info-box {
            flex: 1;
            min-width: 200px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 6px;
            text-align: center;
        }
        
        .info-box h3 {
            margin-top: 0;
        }
        
        .countdown {
            font-size: 24px;
            font-weight: bold;
            color: #ff6b6b;
            margin: 10px 0;
        }
        
        .previous {
            color: #ff9800;
        }
        
        .current {
            background-color: rgba(76, 175, 80, 0.2);
            font-weight: bold;
        }
        
        .next {
            color: #2196f3;
        }
        
        .location-container {
            margin-top: 15px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 5px;
        }
        
        .location-item {
            flex: 1;
            padding: 5px;
        }
        
        .location-name {
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        
        th {
            background-color: #2a2a2a;
            color: #ffd700;
        }
        
        tr:hover {
            background-color: #2e2e2e;
        }
        
        .schedule-options {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }
        
        button, select {
            background-color: #3a3a3a;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover, select:hover {
            background-color: #4a4a4a;
        }
        
        .type-indicator {
            display: inline-flex;
            align-items: center;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .type-indicator i {
            margin-right: 3px;
            font-size: 12px;
        }
        
        .chest {
            background-color: #8a5a44;
            color: white;
        }
        
        .mine {
            background-color: #37747b;
            color: white;
        }
        
        .rotation-indicator {
            text-align: center;
            background-color: #3a3a3a;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .rotation-name {
            font-weight: bold;
            color: #ffd700;
        }
        
        .time-info {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
            display: none; /* Hide this element */
        }
        
        footer {
            margin-top: 30px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }
        
        @media (max-width: 768px) {
            .info-box {
                min-width: 100%;
            }
            
            .location-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>Chest and Mining Node Spawn Tracker</h1>
        <button class="secrets-btn" onclick="window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank')">Supple Secrets</button>
    </div>
    
    <div class="container">
        <div class="card">
            <h2>Current Time: <span id="current-time"></span></h2>
            <div class="countdown" id="next-spawn-countdown"></div>
            

            <div class="current-info">
                <div class="info-box previous">
                    <h3>Previous Spawn</h3>
                    <div id="previous-time"></div>
                    <div class="location-container">
                        <div class="location-item">
                            <span class="type-indicator chest"><i class="fas fa-box-open"></i> CHEST</span>
                            <div id="previous-chest-location" class="location-name"></div>
                        </div>
                        <div class="location-item">
                            <span class="type-indicator mine"><i class="fas fa-gem"></i> MINE</span>
                            <div id="previous-mine-location" class="location-name"></div>
                        </div>
                    </div>
                </div>
                
                <div class="info-box current">
                    <h3>Current Spawn</h3>
                    <div id="current-time-slot"></div>
                    <div class="location-container">
                        <div class="location-item">
                            <span class="type-indicator chest"><i class="fas fa-box-open"></i> CHEST</span>
                            <div id="current-chest-location" class="location-name"></div>
                        </div>
                        <div class="location-item">
                            <span class="type-indicator mine"><i class="fas fa-gem"></i> MINE</span>
                            <div id="current-mine-location" class="location-name"></div>
                        </div>
                    </div>
                </div>
                
                <div class="info-box next">
                    <h3>Next Spawn</h3>
                    <div id="next-time"></div>
                    <div class="location-container">
                        <div class="location-item">
                            <span class="type-indicator chest"><i class="fas fa-box-open"></i> CHEST</span>
                            <div id="next-chest-location" class="location-name"></div>
                        </div>
                        <div class="location-item">
                            <span class="type-indicator mine"><i class="fas fa-gem"></i> MINE</span>
                            <div id="next-mine-location" class="location-name"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>Upcoming 12 Hour Schedule</h2>
            <div class="schedule-options">
                <button id="toggle-schedule-btn">Show/Hide Schedule</button>
            </div>
            
            <div id="schedule-container" style="display: none;">
                <table id="schedule-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Chest Location</th>
                            <th>Mining Location</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body">
                        <!-- Will be filled by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <footer>
        <p>Chest and Mining Node Spawn Tracker | Updated: <span id="last-updated"></span></p>
    </footer>
    
    <script>
        // Define the patterns
        const ROTATIONS = [
            {
                name: "Pattern 1",
                chest: "Seal of Sanctuary",
                mine: "Shrine"
            },
            {
                name: "Pattern 2",
                chest: "Shrine",
                mine: "Arkeum"
            },
            {
                name: "Pattern 3",
                chest: "Arkeum",
                mine: "Orc Village"
            },
            {
                name: "Pattern 4",
                chest: "Orc Village",
                mine: "Seal of Sanctuary"
            }
        ];
        
        // Time interval in minutes for spawns
        const SPAWN_INTERVAL = 20;
        
        // Time interval for rotation changes (hourly)
        const ROTATION_INTERVAL = 60;
        
        // Reference point: At 7PM CST Shrine had chest, Arkeum had mining node (Rotation 2)
        const REFERENCE_HOUR = 19; // 7PM
        const REFERENCE_ROTATION_INDEX = 1; // Rotation 2 (based on provided info)
        
        // Creating reference date in CST/CDT (UTC-5/UTC-6 depending on daylight saving)
        // Convert user's local time to CST/CDT reference
        function createCSTReference(hour) {
            // Create a date object for today
            const referenceDate = new Date();
            
            // Get the user's timezone offset in minutes
            const userTimezoneOffset = referenceDate.getTimezoneOffset();
            
            // CST/CDT timezone offset is either UTC-6 (360 minutes) or UTC-5 (300 minutes) 
            // depending on daylight saving time
            // We'll determine which one to use based on the current date
            const cstOffset = new Date().toLocaleString('en-US', { timeZone: 'America/Chicago', timeZoneName: 'short' }).includes('CDT') ? 300 : 360;
            
            // Calculate the difference between user's timezone and CST/CDT
            const diffFromCST = userTimezoneOffset - cstOffset;
            
            // Set the hour in CST/CDT
            referenceDate.setHours(hour, 0, 0, 0);
            
            // Adjust for the timezone difference (convert CST to user's local time)
            referenceDate.setMinutes(referenceDate.getMinutes() - diffFromCST);
            
            return referenceDate;
        }
        
        // Create the reference date at 7PM CST in user's local time
        const REFERENCE_DATE_CST = createCSTReference(REFERENCE_HOUR);
        
        // Calculate the current rotation and spawn info based on time
        function calculateCurrentInfo() {
            const now = new Date();
            
            try {
                // Calculate how many hours have passed since reference time
                let hoursDiff = Math.floor((now - REFERENCE_DATE_CST) / (1000 * 60 * 60));
                
                // Handle negative time (before reference)
                while (hoursDiff < 0) {
                    hoursDiff += ROTATIONS.length;
                }
                
                // Calculate current rotation
                let currentRotationIndex = (REFERENCE_ROTATION_INDEX + hoursDiff) % ROTATIONS.length;
                
                if (currentRotationIndex < 0 || currentRotationIndex >= ROTATIONS.length) {
                    console.error("Invalid rotation index calculated:", currentRotationIndex);
                    // Fallback to a safe index
                    currentRotationIndex = 0;
                }
                
                // Calculate minutes within the current hour
                const currentHourStart = new Date(now);
                currentHourStart.setMinutes(0, 0, 0);
                const minutesIntoHour = (now - currentHourStart) / (1000 * 60);
                
                // Calculate which spawn interval we're in
                const spawnIntervalIndex = Math.floor(minutesIntoHour / SPAWN_INTERVAL);
                
                // Calculate time until next spawn
                const minutesSinceLastSpawn = minutesIntoHour % SPAWN_INTERVAL;
                const minutesUntilNextSpawn = SPAWN_INTERVAL - minutesSinceLastSpawn;
                
                // Calculate spawn times
                const currentSpawnTime = new Date(now.getTime() - minutesSinceLastSpawn * 60 * 1000);
                const previousSpawnTime = new Date(currentSpawnTime.getTime() - SPAWN_INTERVAL * 60 * 1000);
                const nextSpawnTime = new Date(currentSpawnTime.getTime() + SPAWN_INTERVAL * 60 * 1000);
                
                // Check if previous or next spawn crosses an hour boundary (rotation change)
                const currentHour = currentSpawnTime.getHours();
                const previousHour = previousSpawnTime.getHours();
                const nextHour = nextSpawnTime.getHours();
                
                // Special handling for time zone conversion
                const userOffset = now.getTimezoneOffset();
                const cstOffset = new Date().toLocaleString('en-US', { timeZone: 'America/Chicago', timeZoneName: 'short' }).includes('CDT') ? 300 : 360;
                const diffFromCST = userOffset - cstOffset;
                
                // Convert times to CST for special case handling
                const currentTimeCst = new Date(currentSpawnTime);
                currentTimeCst.setMinutes(currentTimeCst.getMinutes() - diffFromCST);
                const previousTimeCst = new Date(previousSpawnTime);
                previousTimeCst.setMinutes(previousTimeCst.getMinutes() - diffFromCST);
                const nextTimeCst = new Date(nextSpawnTime);
                nextTimeCst.setMinutes(nextTimeCst.getMinutes() - diffFromCST);
                
                // Default calculation (normal case)
                let previousRotationIndex = previousHour !== currentHour
                    ? (currentRotationIndex - 1 + ROTATIONS.length) % ROTATIONS.length
                    : currentRotationIndex;
                    
                let nextRotationIndex = nextHour !== currentHour
                    ? (currentRotationIndex + 1) % ROTATIONS.length
                    : currentRotationIndex;
                
                // Special case: If we're at 9PM CST and the next hour is 10PM CST,
                // skip a rotation for the next spawn
                if (currentTimeCst.getHours() === 21 && nextTimeCst.getHours() === 22) {
                    nextRotationIndex = (currentRotationIndex + 2) % ROTATIONS.length;
                    console.log("Applied post-9PM CST skip for next spawn");
                }
                
                // Special case: If we're at 10PM CST and the previous hour was 9PM CST,
                // the previous rotation should be the 9PM override, not the normal rotation-1
                if (currentTimeCst.getHours() === 22 && previousTimeCst.getHours() === 21) {
                    previousRotationIndex = -1; // Special marker for the override
                }
                
                // Safety checks for rotation indices
                if (previousRotationIndex >= 0 && (previousRotationIndex < 0 || previousRotationIndex >= ROTATIONS.length)) {
                    previousRotationIndex = 0;
                }
                
                if (nextRotationIndex < 0 || nextRotationIndex >= ROTATIONS.length) {
                    nextRotationIndex = 0;
                }
                
                // Prepare result
                let result = {
                    current: {
                        rotation: ROTATIONS[currentRotationIndex],
                        time: currentSpawnTime,
                        index: currentRotationIndex
                    },
                    previous: {
                        rotation: previousRotationIndex >= 0 ? ROTATIONS[previousRotationIndex] : {
                            name: "Override Pattern",
                            chest: "Arkeum",
                            mine: "Orc Village"
                        },
                        time: previousSpawnTime,
                        index: previousRotationIndex >= 0 ? previousRotationIndex : -1
                    },
                    next: {
                        rotation: ROTATIONS[nextRotationIndex],
                        time: nextSpawnTime,
                        index: nextRotationIndex
                    },
                    minutesUntilNextSpawn,
                    spawnIntervalIndex
                };
                
                // Apply 9PM CST override if needed
                if (currentTimeCst.getHours() === 21) {
                    result.current.rotation = {
                        name: "Override Pattern",
                        chest: "Arkeum",
                        mine: "Orc Village"
                    };
                    result.current.index = -1;
                }
                
                return result;
                
            } catch (error) {
                console.error("Error calculating current info:", error);
                // Return fallback data
                return {
                    current: {
                        rotation: ROTATIONS[0],
                        time: now,
                        index: 0
                    },
                    previous: {
                        rotation: ROTATIONS[3],
                        time: new Date(now.getTime() - SPAWN_INTERVAL * 60 * 1000),
                        index: 3
                    },
                    next: {
                        rotation: ROTATIONS[1],
                        time: new Date(now.getTime() + SPAWN_INTERVAL * 60 * 1000),
                        index: 1
                    },
                    minutesUntilNextSpawn: 20,
                    spawnIntervalIndex: 0
                };
            }
        }
        
        // Format time
        function formatTime(date) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        // Format countdown
        function formatCountdown(minutes, seconds) {
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // Update the UI with spawn information
        function updateUI() {
            try {
                const spawnInfo = calculateCurrentInfo();
                const now = new Date();
                
                // Make sure we have valid rotation objects
                if (!spawnInfo.current.rotation || !spawnInfo.previous.rotation || !spawnInfo.next.rotation) {
                    console.error("Missing rotation object in spawn info");
                    return; // Skip update if data is invalid
                }
                
                // Update current time
                document.getElementById('current-time').textContent = formatTime(now);
                
                // Update locations
                document.getElementById('previous-chest-location').textContent = spawnInfo.previous.rotation.chest || "Unknown";
                document.getElementById('previous-mine-location').textContent = spawnInfo.previous.rotation.mine || "Unknown";
                
                document.getElementById('current-chest-location').textContent = spawnInfo.current.rotation.chest || "Unknown";
                document.getElementById('current-mine-location').textContent = spawnInfo.current.rotation.mine || "Unknown";
                
                document.getElementById('next-chest-location').textContent = spawnInfo.next.rotation.chest || "Unknown";
                document.getElementById('next-mine-location').textContent = spawnInfo.next.rotation.mine || "Unknown";
                
                // Update times
                document.getElementById('previous-time').textContent = formatTime(spawnInfo.previous.time);
                document.getElementById('current-time-slot').textContent = formatTime(spawnInfo.current.time);
                document.getElementById('next-time').textContent = formatTime(spawnInfo.next.time);
                
                // Update countdown
                const minutes = Math.floor(spawnInfo.minutesUntilNextSpawn);
                const seconds = Math.floor((spawnInfo.minutesUntilNextSpawn - minutes) * 60);
                document.getElementById('next-spawn-countdown').textContent = `Next Spawn: ${formatCountdown(minutes, seconds)}`;
                
                // Update last updated time
                document.getElementById('last-updated').textContent = now.toLocaleString();
            } catch (error) {
                console.error("Error updating UI:", error);
            }
        }
        
        // Helper function to create a schedule row
        function createScheduleRow(time, rotation, isCurrent) {
            try {
                if (!rotation || typeof rotation !== 'object') {
                    console.error("Invalid rotation object:", rotation);
                    return document.createElement('tr'); // Return empty row
                }
                
                const row = document.createElement('tr');
                if (isCurrent) {
                    row.classList.add('current');
                }
                
                // Time cell
                const timeCell = document.createElement('td');
                timeCell.textContent = formatTime(time);
                row.appendChild(timeCell);
                
                // Chest location cell
                const chestCell = document.createElement('td');
                const chestIndicator = document.createElement('span');
                chestIndicator.innerHTML = '<i class="fas fa-box-open"></i> CHEST';
                chestIndicator.className = "type-indicator chest";
                chestCell.appendChild(chestIndicator);
                chestCell.appendChild(document.createTextNode(" " + (rotation.chest || "Unknown")));
                row.appendChild(chestCell);
                
                // Mining location cell
                const mineCell = document.createElement('td');
                const mineIndicator = document.createElement('span');
                mineIndicator.innerHTML = '<i class="fas fa-gem"></i> MINE';
                mineIndicator.className = "type-indicator mine";
                mineCell.appendChild(mineIndicator);
                mineCell.appendChild(document.createTextNode(" " + (rotation.mine || "Unknown")));
                row.appendChild(mineCell);
                
                return row;
            } catch (error) {
                console.error("Error creating schedule row:", error);
                return document.createElement('tr'); // Return empty row on error
            }
        }
        
        // Toggle schedule visibility and generate fresh content
        function toggleSchedule() {
            try {
                const scheduleContainer = document.getElementById('schedule-container');
                const isVisible = scheduleContainer.style.display !== 'none';
                
                scheduleContainer.style.display = isVisible ? 'none' : 'block';
                
                // Generate schedule if it's being shown
                if (!isVisible) {
                    generateSchedule();
                }
            } catch (error) {
                console.error("Error toggling schedule:", error);
            }
        }
        
        // Generate schedule starting from the current time
        function generateSchedule() {
            try {
                console.log("Generating schedule");
                const scheduleBody = document.getElementById('schedule-body');
                scheduleBody.innerHTML = '';
                
                // Get current time and spawn info
                const now = new Date();
                const spawnInfo = calculateCurrentInfo();
                
                // Ensure we have valid data
                if (!spawnInfo || !spawnInfo.current || !spawnInfo.current.rotation) {
                    console.error("Invalid spawn info for schedule generation");
                    return;
                }
                
                // Start with the current spawn time
                const currentSpawnTime = spawnInfo.current.time;
                let rotationIndex = spawnInfo.current.index;
                let rotation = ROTATIONS[rotationIndex];
                
                if (!rotation) {
                    console.error("Invalid rotation for index:", rotationIndex);
                    return;
                }
                
                // Generate rows starting with current spawn
                const entries = [];
                
                // First add current spawn (highlighted)
                let currentRow;
                
                // Check if we need to apply the 9PM CST override
                const userTimeToCst = new Date(now.getTime());
                const userOffset = userTimeToCst.getTimezoneOffset();
                const cstOffset = new Date().toLocaleString('en-US', { timeZone: 'America/Chicago', timeZoneName: 'short' }).includes('CDT') ? 300 : 360;
                const diffFromCST = userOffset - cstOffset;
                userTimeToCst.setMinutes(userTimeToCst.getMinutes() - diffFromCST);
                const cstHour = userTimeToCst.getHours();
                
                // Apply 9PM CST override if needed
                if (cstHour === 21) {
                    currentRow = createScheduleRow(currentSpawnTime, {
                        name: "Override Pattern",
                        chest: "Arkeum",
                        mine: "Orc Village"
                    }, true);
                } else {
                    currentRow = createScheduleRow(currentSpawnTime, rotation, true);
                }
                
                entries.push(currentRow);
                
                // Generate entries for next 12 hours (36 entries total - we already added the current one)
                let scheduleTime = new Date(currentSpawnTime);
                
                for (let i = 0; i < 35; i++) {
                    // Move to next spawn time
                    scheduleTime = new Date(scheduleTime.getTime() + SPAWN_INTERVAL * 60 * 1000);
                    
                    // Convert schedule time to CST for checking special cases
                    const scheduleTimeToCst = new Date(scheduleTime.getTime());
                    scheduleTimeToCst.setMinutes(scheduleTimeToCst.getMinutes() - diffFromCST);
                    const scheduleHourCst = scheduleTimeToCst.getHours();
                    
                    // Check if we need to update rotation (hour change)
                    const hourChanged = Math.floor(scheduleTime.getTime() / (1000 * 60 * 60)) > 
                                        Math.floor((scheduleTime.getTime() - SPAWN_INTERVAL * 60 * 1000) / (1000 * 60 * 60));
                    
                    if (hourChanged) {
                        // Special case: if we're moving from 9PM CST to 10PM CST, skip the next rotation
                        // and go directly to the following one
                        const prevSchedTimeToCst = new Date(scheduleTime.getTime() - SPAWN_INTERVAL * 60 * 1000);
                        prevSchedTimeToCst.setMinutes(prevSchedTimeToCst.getMinutes() - diffFromCST);
                        
                        if (prevSchedTimeToCst.getHours() === 21 && scheduleHourCst === 22) {
                            // Skip the next rotation (add 2 instead of 1)
                            rotationIndex = (rotationIndex + 2) % ROTATIONS.length;
                            console.log("Applied post-9PM CST skip, new index:", rotationIndex);
                        } else {
                            rotationIndex = (rotationIndex + 1) % ROTATIONS.length;
                        }
                    }
                    
                    // Apply 9PM CST override if needed
                    if (scheduleHourCst === 21) {
                        const row = createScheduleRow(scheduleTime, {
                            name: "Override Pattern",
                            chest: "Arkeum",
                            mine: "Orc Village"
                        }, false);
                        entries.push(row);
                    } else {
                        rotation = ROTATIONS[rotationIndex];
                        if (rotation) {
                            const row = createScheduleRow(scheduleTime, rotation, false);
                            entries.push(row);
                        }
                    }
                }
                
                // Add all rows to the schedule body
                entries.forEach(row => {
                    scheduleBody.appendChild(row);
                });
                
                console.log("Schedule generated with", entries.length, "entries");
            } catch (error) {
                console.error("Error generating schedule:", error);
            }
        }
        
        // Initialize the application
        function init() {
            try {
                console.log("Initializing tracker");
                
                // Initial UI update
                updateUI();
                
                // Set up periodic updates for the main display
                setInterval(updateUI, 1000);
                
                // Set up event listener for schedule toggle
                const toggleBtn = document.getElementById('toggle-schedule-btn');
                if (toggleBtn) {
                    toggleBtn.addEventListener('click', function() {
                        console.log("Toggle button clicked");
                        toggleSchedule();
                    });
                } else {
                    console.error("Toggle button not found");
                }
                
                // Regenerate schedule every 20 minutes if it's visible
                setInterval(() => {
                    const container = document.getElementById('schedule-container');
                    if (container && container.style.display !== 'none') {
                        generateSchedule();
                    }
                }, 20 * 60 * 1000);
                
                console.log("Tracker initialized successfully");
            } catch (error) {
                console.error("Error initializing tracker:", error);
            }
        }
        
        // Start the application when the page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
